<!DOCTYPE html>

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>drug matching game</title>
        <link rel="stylesheet" href="main.css">
        <script type="module">
            import { init } from "./main.js";
            init();

    <body>

            <img src="images/logo_v1.png">
